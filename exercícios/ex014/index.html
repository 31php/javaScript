<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="estilos/style.css" media="all">
    <title>formulário</title>
</head>
<body>
    <header>
        <h1>Formulário</h1>
    </header>
    <main>
        <form id="form" action="" method="get" autocomplete="on">
            <fieldset>
                <legend>Dados Pessoais</legend>  
                
                <p>
                    <label for="">Nome:</label>
                    <input type="text" name="" id="nome" placeholder="nome">
                </p>
                <p>
                    <label for="">Sobrenome</label>
                    <input type="text" name="" class="sobrenome placeholder="sobrenome">
                </p>               
                <p>
                    <label for="">Idade</label>
                    <input type="number" name="" id="idade" placeholder="idade">
                </p>
            </fieldset>
            <button>Enviar</button>  
            <input type="reset" value="Limpar">          
        </form>
        <div id="resultado"></div>
    </main>
    <script src="exercicio20.js"></script>
</body>
</html>
