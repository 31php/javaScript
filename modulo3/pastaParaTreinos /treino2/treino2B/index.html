<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <title>Laços de repetição</title>
</head>
<body>
    <header>
        <h1>Notas</h1>
    </header>
  <main>
      <section>
          <form action="" method="get" autocomplete="on" id="meuFormulario">
            <p>
                <label for="n1">Português</label>
                <input type="number" id="n1" required>
            </p>
            <p>
                <label for="n2">Matemática</label>
                <input type="number" id="n2" required>
            </p>
            <p>
                <label for="n3">História</label>
                <input type="number" id="n3" required>
            </p>
            <p>
                <label for="n4">Geografia</label>
                <input type="number" id="n4" required>
            </p>
            <div>Média: <span id="resultado">0</span></div>

            <div>Status: <span id="resposta"></span></div>

            <button id="botao1">Enviar</button>
            <button id="botao2">Limpar</button>
          </form>
      </section>
  </main>
</body>
</html>
