<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <title>Laços de repetição</title>
</head>
<body>
    <header>
        <h1>Notas</h1>
    </header>
    <main>
        <section>
            <form action="" method="get" autocomplete="on">
                <p>
                    <label for="n1">Nota 1:</label>
                    <input type="number" id="n1">
                </p>
                <p>
                    <label for="n2">Nota 2:</label>
                    <input type="number" id="n2">
                </p>
                 <p>
                    <label for="n3">Nota 3:</label>
                    <input type="number" id="n3">
                </p>
                 <p>
                    <label for="n4">Nota 4:</label>
                    <input type="number" id="n4">
                </p>
                <div>Média: <span class="resultado">0</span></div>

                <div>Status: <span class="resposta"></span></div> 

                <button type="submit" class="enviar">Enviar</button>
                <button type="reset" class="limpar">Limpar</button>             
            </form>                                 
        </section>
    </main>
    <script src="js/script.js"></script>
</body>
</html>
