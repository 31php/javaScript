<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>inputs</title>
</head>
<body>
    <form action="" method="get" autocomplete="on" id="meuFormulario">
        <fieldset>
            <legend>Login</legend>
            <p>
                <label for="meuLogin">Login</label>
                <input type="email" name="" id="meuLogin" placeholder="seu email" required>
            </p>
            <p>
                <label for="minhaSenha">Senha</label>
                <input type="password" name="" id="minhaSenha" maxlength="4" placeholder="senha de 4 dígitos">
            </p>
        </fieldset>

        <button>Enviar</button>

        <div id="resposta"></div>
    </form>

    <script>
        const form = window.document.querySelector('#meuFormulario');

        form.addEventListener('submit', function(evento){
            evento.preventDefault();

            const email = window.document.querySelector('#meuLogin').value;
            const senha = window.document.querySelector('#minhaSenha').value;

            const txt = window.document.querySelector('#resposta');
             
            const acesso = (email === 'phillip.php31@gmail.com' && senha === '1234') ? 'acesso liberado' : 'acesso negado';   

            txt.innerHTML = acesso;
        })
    </script>
</body>
</html>
